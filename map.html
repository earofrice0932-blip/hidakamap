      const g = parseInt(hex.slice(3, 5), 16);

      return `rgba(${r}, ${g}, ${b}, ${alpha})`;

        `<span style="
          display:inline-block;
          width:16px;
          height:10px;
          background:${hexToRgba(colorPolyMap["耕作放棄地"], 0.3)};
          border: 1.5px solid ${colorPolyMap["耕作放棄地"]};
          margin-right:6px;
          vertical-align:middle;
        "></span>${"耕作放棄地"}<br>`;
        
      div.innerHTML = html;
      return div;
    };

    legend.addTo(map);

    const envpoinLayer = L.geoJSON(envPoint, {
      // ★colorPoinMapに無い属性値のフィーチャーは、最初から地図に追加しない
      filter: function (feature) {
        return Object.prototype.hasOwnProperty.call(colorPoinMap, feature.properties.sign);
      },
      pointToLayer: function (feature, latlng) {
        const value = feature.properties.sign;
        return L.circleMarker (latlng, {
          radius: 7.5,
          color: colorPoinMap[value] || null,
          weight: 2,
          fillColor: colorPoinMap[value] || null,
          fillOpacity: 1
        })
      },
      onEachFeature: function (feature, layer) {
        // クリックで属性をポップアップ表示
        layer.bindPopup(`${feature.properties.sign}`);
      }
    }).addTo(map);

    // ラジオボタンで切替
    document.querySelectorAll('input[name="basemap"]').forEach(radio => {
      radio.addEventListener("change", () => {
        if (radio.value === "osm") {
          map.removeLayer(gsiPhotoLayer);
          osmLayer.addTo(map);
        } else if (radio.value === "gsi") {
          map.removeLayer(osmLayer);
          gsiPhotoLayer.addTo(map);
        }
      });
    });

    document.querySelectorAll('input[name="areaToggle"]').forEach(radio => {
      radio.addEventListener("change", () => {
        if (radio.value === "show") {
          map.addLayer(areaLayer);
        } else if (radio.value === "hide") {
          map.removeLayer(areaLayer);
        }
      });
    });
  </script>

</body>
</html>
